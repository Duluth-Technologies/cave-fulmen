<!-- Main app container with theme support -->
<div class="app-container">
  <!-- Header with app branding and theme toggle (Requirement 13.1-13.4) -->
  <app-header 
    [isDarkMode]="isDarkMode"
    (onThemeToggle)="toggleTheme()"
  ></app-header>

  <!-- Status indicators in non-intrusive position (Requirement 14.4) -->
  <aside class="status-bar" aria-label="Application status">
    <app-status-indicators
      [gpsAccuracy]="accuracy"
      [isOnline]="isOnline"
      [wakeLockActive]="wakeLockActive"
    ></app-status-indicators>
  </aside>

  <!-- Loading state when GPS not available (Requirement 5.1, 5.2, 5.4) -->
  @if (lat === null || lon === null) {
    <main class="main-content loading">
      <app-loading-state></app-loading-state>
    </main>
  } @else {
    <!-- Main content area with proper visual grouping (Requirement 14.1-14.3) -->
    <main class="main-content" *ngIf="cameraInfo$ | async as cameraInfo">
      <!-- Directional arrow pointing to camera (Requirements 8.1-8.5, 9.1-9.3) -->
      <div class="arrow-section">
        <app-directional-arrow
          [angle]="computeAngle(cameraInfo.lat, cameraInfo.lon)"
          [speed]="speed"
          [distance]="cameraInfo.distance"
          [isDarkMode]="isDarkMode"
        ></app-directional-arrow>
      </div>

      <!-- Distance display with color-coded warnings (Requirements 2.1-2.5) -->
      <div class="distance-section">
        <app-distance-display
          [distance]="cameraInfo.distance"
          [isDarkMode]="isDarkMode"
        ></app-distance-display>
      </div>

      <!-- Speed display with color-coded warnings (Requirements 10.1-10.5) -->
      <div class="speed-section" *ngIf="speed !== null">
        <app-speed-display
          [speed]="speed"
          [speedLimit]="cameraInfo.maxSpeed"
          [isWithinThreshold]="cameraInfo.distance <= speedLimitThreshold"
          [isDarkMode]="isDarkMode"
        ></app-speed-display>
      </div>

      <!-- Speed limit circle when approaching camera (Requirements 3.1-3.4) -->
      <div class="speed-limit-section">
        <app-speed-limit-circle
          [speedLimit]="cameraInfo.maxSpeed"
          [distance]="cameraInfo.distance"
          [isVisibleInput]="cameraInfo.distance <= speedLimitThreshold"
        ></app-speed-limit-circle>
      </div>
    </main>

    <!-- Fallback when no camera info available -->
    <main class="main-content" *ngIf="!(cameraInfo$ | async)">
      <div class="no-camera-info">
        <p>Searching for nearby cameras...</p>
      </div>
    </main>
  }

  <!-- Wake lock button - accessible but not prominent (Requirement 12.1-12.4) -->
  <footer class="app-footer" role="contentinfo">
    <app-wake-lock-button
      [isActive]="wakeLockActive"
      (toggle)="toggleWakeLock()"
    ></app-wake-lock-button>
  </footer>
</div>
