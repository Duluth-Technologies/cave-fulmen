name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    # Run monthly on the 1st at 03:00 UTC
    - cron: '0 3 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Sync committed radar data to app assets
        run: cp gen/data/radars.json src/assets/data/radars.json

      - name: Validate committed radar dataset is non-empty
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("gen/data/radars.json", "utf8"));
            if (!Array.isArray(data) || data.length === 0) {
              throw new Error("Committed radar dataset is empty.");
            }
            console.log(`Committed radar count: ${data.length}`);
          '

      - name: Install dependencies
        run: npm install
        
      - name: Run tests
        run: npm run test -- --watch=false

      - name: Build the application
        run: npx ng build --configuration production --base-href "/"

      - name: Configure custom domain
        run: echo -n 'app.cavefulmen.com' > ./dist/cavefulmen/browser/CNAME
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/cavefulmen/browser
